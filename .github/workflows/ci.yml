name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  # A repository variable makes another repository girlc's default (in its
  # packages and image), rather than girlpages.dev's.
  GIRLC_REPO: ${{ vars.GIRLC_REPO }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # node runs the browser search against the Go one; cpio unpacks test rpms.
      - run: sudo apt-get update && sudo apt-get install -y man-db cpio nodejs
      - run: make check
      - run: make
      - run: make install DESTDIR="$PWD/stage" HOOKS="apt pacman dnf" SYSTEMD=yes && find stage -type f

  # deb, rpm, apk and Arch packages of girlpages (all of it) and girlc
  # (alone), for each architecture.
  packages:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the version: the tag, or the commit's date
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: |
          curl -fsSLo nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm && sudo install nfpm /usr/local/bin/ && rm nfpm nfpm.tar.gz
      - run: dist/package.sh -a ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error

  # Binaries for using without a package manager: girlc on its own for
  # each system it runs on, and every binary, with their man pages, in a
  # tarball per Linux architecture (see dist/binaries.sh).
  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the version: the tag, or the commit's date
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: dist/binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/binaries/*
          if-no-files-found: error

  # Images of girlpages (all of it, on Debian), and girlc and girlserve (alone, on
  # nothing), for amd64 and arm64: pushed to ghcr.io for main (as edge)
  # and releases (as their version and latest), built for anything else.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [girlpages, girlc, girlserve]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: info
        run: |
          echo "version=$(dist/version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.info.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: steps.info.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.info.outputs.version }}
            GIRLC_REPO=${{ env.GIRLC_REPO }}
          push: ${{ steps.info.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A tag (v1.2.0) makes a release, with every package and binary, and
  # their checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: packages
      - run: cd packages && sha256sum * > SHA256SUMS
      # Made, then filled, so running it again finishes what failed. GitHub
      # sometimes fails to make a release with an HTTP 500 (working out
      # its notes from the tags, it seems), and sometimes makes it anyway:
      # so look before trying again, and after a couple of goes, do without
      # the notes.
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag)
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          for try in 1 2 3 4; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            if (( try <= 2 )); then notes=(--generate-notes); else notes=(--notes "girlpages $TAG"); fi
            gh release create "$TAG" "${args[@]}" "${notes[@]}" && break
            sleep $(( try * 15 ))
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for try in 1 2 3; do
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            sleep $(( try * 15 ))
          done
          exit 1
