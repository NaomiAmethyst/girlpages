#
# nginx serving a girlpages site built by
# `girlrepo -d /srv/girlpages publish --url https://girlpages.dev`.
#
# girlrepo publish writes .zst, .br and .gz copies of every file worth
# compressing; nginx sends them as they are with:
#   gzip_static    the stock ngx_http_gzip_static_module
#   brotli_static  ngx_brotli            (https://github.com/google/ngx_brotli)
#   zstd_static    zstd-nginx-module     (https://github.com/tokers/zstd-nginx-module)
# Leave out the lines for modules you haven't got; clients fall back.
# Cache lifetimes match girlrepo serve (and girlrepo(1)).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name girlpages.dev;
    # ssl_certificate / ssl_certificate_key …

    root /srv/girlpages;
    index index.html;
    error_page 404 /404.html;

    gzip off;               # nothing is compressed per request…
    gzip_static on;         # …only sent as girlrepo compressed it
    gzip_vary on;
    brotli_static on;
    zstd_static on;

    # The lock file, half-written files, and anything else hidden.
    location ~ /\. {
        return 404;
    }

    # The website: pages, scripts, styles.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # Pages in a variant (girl/1/ls/ is the static, girly one; pirate/1/ls/
    # and man/1/ls/, the original, are drawn by the app), and listings,
    # searches and the home page in one (pirate/section/1/): whatever isn't
    # a file gets the app's shell. List the variants your site has (girlserve
    # reads them from its manifest).
    location ~ "^/(girl|man|boy|femboy|lolcat|pirate|eli5|woman|witch|bofh)/" {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /static/shell.html;
    }

    # A series' old addresses (rfc/9110/, rfc/, rfc/page/2/): where they are now.
    location = /rfc/ {
        return 301 /section/rfc/;
    }
    location ~ "^/rfc/page/([0-9]+)/$" {
        return 301 /section/rfc/page/$1/;
    }
    location ~ "^/rfc/([^/]+)/$" {
        return 301 /girl/rfc/$1/;
    }

    # The web app manifest: stock mime.types doesn't know it, and a types
    # block here would replace the whole of mime.types.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # The service worker must always be checked for updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # manifest.json and the pointers into the rest (name and section
    # pointers, contents' variants.json): they change on every publish.
    location /repo/ {
        add_header Cache-Control "public, max-age=300";
    }

    # Files named after their own hash never change.
    # (Regexes with {} must be quoted in nginx.)
    location ~ "^/repo/(page/page-[0-9a-f]{2}|index)/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ "^/repo/(section/[^/]+|contents/[0-9a-f]{2}/[0-9a-f]{64}/[a-z][a-z0-9-]*)-[0-9a-f]{64}\.json$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Packs (but not packs/index.json, which changes).
    location ~ "^/repo/packs/[0-9a-f]{64}\.tar\.zst$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
