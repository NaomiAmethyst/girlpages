# girlpages config ✨
#
# Read from /etc/girlpages/config.toml, then ~/.config/girlpages/config.toml
# (later files win), then GIRLPAGES_* environment variables. See girl(1).

# "auto" uses openai.base_url if you've set one, else the claude CLI if it's
# on $PATH, else OpenAI proper if there's an API key.
#backend = "auto"

# LLM requests at once. For a single page, the parts of a long page are
# converted in parallel; for --bulk, whole pages are.
#jobs = 4

# Long pages are sent in parts of at most this many bytes of rendered text,
# split at section boundaries. Lower it if replies get cut off.
#chunk_size = 12000

# Where new conversions are written. Default: /var/cache/girlpages when run
# as root, ~/.cache/girlpages otherwise. Both are always read.
#cache_dir = ""

# Pager. Default: $GIRLPAGER, then $PAGER, then less.
#pager = "less"

# Batches: girl --bulk and girlrepo girlify can send pages as batches
# instead of one request at a time: about half the price, back within a
# day. "openrouter" uses [openai] below (its key, model and batch_url);
# "anthropic" uses Anthropic's Message Batches API and [anthropic]; "sail"
# uses Sail's batch API (base_url + /batches, or batch_url), which runs in
# its cheapest, flex, window, with [openai]'s key and model. Runs save
# what they sent, and the next run collects it (--no-wait doesn't wait; the
# hooks and timer use that). Single pages and --serve stay live. Default:
# openrouter if openai.batch_url is set, otherwise none.
#batch = "anthropic"
#batch = "sail"
# Requests in one batch, at most (0: as many as the API takes). Smaller
# batches come back sooner, and a run sends as many as it needs.
#batch_max_requests = 3000

# Tune the vibe. Appended to the system prompt.
#extra_instructions = "She's really into horses. Work in horse metaphors."

[claude]
# Runs: claude -p --model MODEL --system-prompt … --tools "" (page on stdin)
#command = "claude"
# Defaults to haiku: fast, cheap, and good at keeping details. Set it to ""
# to use the claude CLI's own default model.
#model = "haiku"
# Extra arguments, e.g. ["--effort", "low"].
#args = []
#timeout = "15m"

[openai]
# Any OpenAI-compatible endpoint works: OpenAI, OpenRouter, Ollama
# (http://localhost:11434/v1), llama.cpp, vLLM, LM Studio, …
#base_url = "https://api.openai.com/v1"
#model = ""
# Or set OPENAI_API_KEY / GIRLPAGES_OPENAI_API_KEY. If this file is
# world-readable, prefer api_key_file pointing at a root-only file.
#api_key = ""
#api_key_file = ""
#temperature = 0.9
#max_tokens = 16000
#timeout = "10m"
# Which API: "chat" (chat completions, the default) or "responses".
#api = "chat"
# For servers with completion windows (Sail, https://api.sailresearch.com/v1):
# how long a request may wait, for a lower price. asap is straight away;
# balanced queues for a while; flex, cheapest, waits for room, and needs
# api = "responses". Responses requests that wait go in the background and
# girl checks on them until they're done.
#completion_window = "balanced"
# OpenRouter's batch endpoint, for batch = "openrouter" (setting it is
# enough to turn that on). See batch, above.
#batch_url = "https://openrouter.ai/api/v1/batches"
# How often to check on a batch while waiting for it (either API).
#batch_poll = "1m"

#[openai.headers]
#"HTTP-Referer" = "https://github.com/NaomiAmethyst/girlpages"

# Added to every request (batches too), for what a server takes beyond the
# usual. With OpenRouter: which providers to use, and no thinking.
#[openai.extra]
#provider = { only = ["deepinfra"], allow_fallbacks = false }
#reasoning = { enabled = false }

[repo]
# A girlpages repository (made with girlrepo) to fetch ready-made pages from
# before asking a model: an https:// URL, a file:// URL or a directory. Only
# pages whose source exactly matches yours are used. Not used when
# extra_instructions is set. girl -r and girlc read any page in it.
#url = ""
#timeout = "20s"

[anthropic]
# Anthropic's API, used for batch = "anthropic". This is separate from the
# claude CLI: it needs an API key (or set ANTHROPIC_API_KEY).
#api_key = ""
#api_key_file = ""
#model = "claude-haiku-5-5"
# Per reply, thinking included.
#max_tokens = 32000
#batch_url = "https://api.anthropic.com/v1/messages/batches"
#timeout = "10m"
