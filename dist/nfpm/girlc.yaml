#
# girlc alone, as nfpm builds it into a package (dist/package.sh fills in
# GIRLC, the binary, and sets ARCH and VERSION): one static binary, for
# machines (containers, say) that want the manual without man pages.
name: girlc
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: utils
priority: optional
maintainer: Naomi Persephone Amethyst <naomi@amethyst.name>
vendor: girlpages
homepage: https://github.com/NaomiAmethyst/girlpages
license: GPL-3.0-or-later
description: |-
  read girly man pages from a girlpages repository
  girlc reads man pages, girlified by girl, straight from a girlpages
  repository, the way man reads them from the system: one static binary, with
  nothing else installed, not even man pages.
contents:
  - src: ${GIRLC}
    dst: /usr/bin/girlc
    file_info:
      mode: 0755
  - src: man/girlc.1
    dst: /usr/share/man/man1/girlc.1
    file_info:
      mode: 0644
