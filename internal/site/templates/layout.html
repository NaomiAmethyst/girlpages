{{define "layout"}}<!doctype html>
<html lang="en" data-base="{{.Base}}" data-repo="{{.Base}}repo/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="girlpages {{.Version}}">
<title>{{.Title}} · girlpages 💅</title>
{{if .Description}}<meta name="description" content="{{.Description}}">
<meta property="og:description" content="{{.Description}}">{{end}}
<meta property="og:title" content="{{.Title}} · girlpages">
<meta property="og:site_name" content="girlpages">
{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">
<meta property="og:url" content="{{.Canonical}}">{{end}}
{{if .NoIndex}}<meta name="robots" content="noindex, follow">{{end}}
<link rel="icon" href="{{.Base}}static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{.Base}}static/apple-touch-icon.png">
<link rel="manifest" href="{{.Base}}manifest.webmanifest">
<meta name="theme-color" content="#ff3e9a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="girlpages">
<script>try{var t=localStorage.getItem("girlpages-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{.Base}}static/style.css?v={{.Version}}">
</head>
<body>
<header class="top">
<a class="logo" href="{{.Base}}">girl<span>✿</span>pages</a>
<form class="search" action="{{.Base}}search/" role="search"><input type="search" name="q" value="{{.Query}}" placeholder="search pages, bestie… 🔎" aria-label="Search manual pages"></form>
<button class="theme" type="button" onclick="girlTheme()" aria-label="Switch light or dark theme" title="switch theme">🌗</button>
</header>
<main>
{{template "content" .}}
</main>
<footer>made with 💖 by <a href="https://github.com/NaomiAmethyst/girlpages">girlpages</a> {{.Version}} · rewritten by an LLM, so check the original when it really matters</footer>
{{if not .Search}}<script type="module" src="{{.Base}}static/girlpages.js"></script>{{end}}
<script>function girlTheme(){var r=document.documentElement,c=r.dataset.theme,d=c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches,n=d?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("girlpages-theme",n)}catch(e){}}</script>
</body>
</html>
{{end}}
