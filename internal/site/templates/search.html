{{define "content"}}
<div class="card" id="search" data-repo="{{.Base}}repo/" data-base="{{.Base}}">
<div class="crumbs"><a href="{{.Base}}">home</a> › search</div>
<div class="pagehead">
<h1>🔎 search</h1>
<p class="sub" id="search-status">type something up there, bestie: “in quotes” for a phrase, pkg:coreutils for a package’s pages</p>
<p class="save"><button type="button" class="pill" data-save-search="words" hidden>⬇️ save search for offline</button>
<button type="button" class="pill" data-save-search="typos" hidden>⬇️ save typo matching for offline</button>
<a class="pill" id="search-saved" hidden></a></p>
</div>
<nav class="chips modes" id="search-mode" aria-label="How words match"></nav>
<nav class="chips sources" id="search-sources" aria-label="Search within a source"></nav>
<ul class="pages" id="search-results"></ul>
<noscript><div class="empty">search needs JavaScript 😭 but every section is browsable from the <a href="{{.Base}}">home page</a>!</div></noscript>
</div>
<script type="module" src="{{.Base}}static/search.js"></script>
{{end}}
