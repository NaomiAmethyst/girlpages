{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="girlpages {{.Version}}">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<title>{{.Title}} · girlpages 💅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%85%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("girlpages-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
{{if .Standalone}}<style>{{.CSS}}</style>{{else}}<link rel="stylesheet" href="/static/style.css?v={{.Version}}">{{end}}
</head>
<body>
<header class="top">
{{if .Standalone}}<span class="logo">girl<span>✿</span>pages</span>{{else}}<a class="logo" href="/">girl<span>✿</span>pages</a>
<form class="search" action="/search" role="search"><input type="search" name="q" value="{{.Query}}" placeholder="search pages, bestie… 🔎" aria-label="Search manual pages"></form>{{end}}
<button class="theme" type="button" onclick="girlTheme()" aria-label="Switch light or dark theme" title="switch theme">🌗</button>
</header>
<main>
{{template "content" .}}
</main>
<footer>made with 💖 by <a href="https://github.com/NaomiAmethyst/girlpages">girlpages</a> {{.Version}} · rewritten by an LLM, so check the original when it really matters</footer>
<script>function girlTheme(){var r=document.documentElement,c=r.dataset.theme,d=c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches,n=d?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("girlpages-theme",n)}catch(e){}}</script>
</body>
</html>
{{end}}
